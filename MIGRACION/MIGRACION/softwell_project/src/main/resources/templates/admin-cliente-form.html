<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>Admin LJE</h3>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin}" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a th:href="@{/admin/productos}" class="nav-item"><i class="fas fa-box-open"></i> Productos</a>
            <a th:href="@{/admin/pedidos}" class="nav-item"><i class="fas fa-receipt"></i> Pedidos</a>
            <a th:href="@{/admin/clientes}" class="nav-item active"><i class="fas fa-users"></i> Clientes</a>
            <a th:href="@{/admin/testimonios}" class="nav-item"><i class="fas fa-comment-dots"></i> Testimonios</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="admin-header">
            <h1>Editar Cliente</h1>
        </header>

        <section class="content-section active">
            <div class="form-container" style="max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: var(--shadow);">
                <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{rol}" />
                    <input type="hidden" th:field="*{password}" />
                    <input type="hidden" th:field="*{activo}" />
    
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required>
                    </div>
    
                    <div class="form-group">
                        <label for="email">Email (no se puede cambiar)</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" readonly>
                    </div>
    
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" th:field="*{telefono}" class="form-control">
                    </div>
    
                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" th:field="*{direccion}" class="form-control">
                    </div>
    
                    <div class="form-actions" style="margin-top: 20px; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        <a th:href="@{/admin/clientes}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
