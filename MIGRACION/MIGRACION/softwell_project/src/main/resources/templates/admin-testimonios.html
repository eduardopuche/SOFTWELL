<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Testimonios</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>Admin LJE</h3>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin}" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a th:href="@{/admin/productos}" class="nav-item"><i class="fas fa-box-open"></i> Productos</a>
            <a th:href="@{/admin/ofertas}" class="nav-item"><i class="fas fa-handshake"></i> Ofertas</a>
            <a th:href="@{/admin/reportes}" class="nav-item"><i class="fas fa-chart-bar"></i> Reportes</a>
            <a th:href="@{/admin/pedidos}" class="nav-item"><i class="fas fa-receipt"></i> Pedidos</a>
            <a th:href="@{/admin/clientes}" class="nav-item"><i class="fas fa-users"></i> Clientes</a>
            <a th:href="@{/admin/testimonios}" class="nav-item active"><i class="fas fa-comment-dots"></i> Testimonios</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post" style="margin:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button></form>
        </div>
    </aside>

    <main class="main-content">
        <header class="admin-header">
            <h1>Gestión de Testimonios</h1>
            <a th:href="@{/admin/testimonios/nuevo}" class="btn btn-primary"><i class="fas fa-plus"></i> Añadir Testimonio</a>
        </header>

        <section class="content-section active">
            <div th:if="${success}" class="alert alert-success" style="background-color: #d4edda; color: #155724; border-color: #c3e6cb; margin-bottom: 20px;">
                <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            </div>

            <div class="card shadow">
                <div class="card-header">
                    <h6 class="m-0 font-weight-bold text-primary">Todos los Testimonios</h6>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="admin-table" width="100%" cellspacing="0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Texto</th>
                                <th>Visible</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="testimonio : ${testimonios}">
                                <td th:text="${testimonio.id}">1</td>
                                <td th:text="${testimonio.nombreCliente}"></td>
                                <td th:text="${#strings.abbreviate(testimonio.texto, 80)}">Texto del testimonio...</td>
                                <td>
                                    <span th:if="${testimonio.visible}" class="badge badge-success">Sí</span>
                                    <span th:unless="${testimonio.visible}" class="badge badge-danger">No</span>
                                </td>
                                <td style="display: flex; gap: 8px;">
                                    <form th:if="${!testimonio.visible}" th:action="@{/admin/testimonios/aprobar/{id}(id=${testimonio.id})}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-success btn-sm" title="Aprobar"><i class="fas fa-check"></i></button>
                                    </form>
                                    <a th:href="@{/admin/testimonios/editar/{id}(id=${testimonio.id})}" class="btn btn-info btn-sm" title="Editar"><i class="fas fa-edit"></i></a>
                                    <form th:action="@{/admin/testimonios/eliminar/{id}(id=${testimonio.id})}" method="post" onsubmit="return confirm('¿Estás seguro?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="btn btn-danger btn-sm" title="Eliminar"><i class="fas fa-trash"></i></button></form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
