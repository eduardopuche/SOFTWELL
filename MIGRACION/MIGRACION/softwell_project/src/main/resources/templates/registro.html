<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Cuenta - Latin Jewelry Elegance</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --gold-brand: #c5a059;
            --gold-hover: #b08d4a;
            --dark-bg: #1a1a1a;
            --light-gray: #f4f4f4;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--light-gray);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-wrapper {
            width: 100%;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .login-box { 
            width: 100%; 
            max-width: 1000px; 
            background: #fff; 
            border-radius: 24px; 
            padding: 50px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
            box-sizing: border-box;
        }

        /* Encabezado con corrección de borde curvo */
        .header-frame {
            background-color: var(--dark-bg); 
            padding: 40px 30px;
            border-radius: 18px;
            margin-bottom: 40px;
            text-align: center;
            /* La sombra interna (inset) respeta el border-radius de las esquinas */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2), 
                        inset 0 -5px 0 0 var(--gold-brand); 
            transition: all 0.4s ease;
        }

        .header-frame:hover {
            background-color: var(--gold-brand);
            /* Cambiamos el color de la sombra interna en el hover */
            box-shadow: 0 15px 30px rgba(197, 160, 89, 0.3), 
                        inset 0 -5px 0 0 var(--dark-bg);
            transform: translateY(-5px);
        }

        .login-header h1 { 
            font-size: 2.8rem; 
            color: #ffffff; 
            font-family: 'Playfair Display', serif; 
            margin: 0 0 10px 0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .login-header p { 
            color: var(--gold-brand); 
            font-size: 1.1rem; 
            margin: 0; 
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .header-frame:hover .login-header p {
            color: var(--dark-bg);
        }

        .login-form { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
        }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }

        .form-group label { 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #444; 
            font-size: 0.9rem;
        }

        .login-form input, .login-form select { 
            padding: 14px; 
            border-radius: 12px; 
            border: 1.5px solid #eee; 
            background-color: #fcfcfc;
            font-size: 1rem;
            transition: 0.3s;
            width: 100%;
            box-sizing: border-box;
        }

        .login-form input:focus, .login-form select:focus { 
            border-color: var(--gold-brand); 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.1);
        }

        #map-registro { 
            height: 400px; 
            width: 100%; 
            border-radius: 18px; 
            margin-top: 15px; 
            border: 1px solid #ddd;
            display: none; 
        }

        .button-row { display: flex; gap: 15px; margin: 10px 0; }
        
        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action.gps { color: #28a745; border-color: #28a745; }
        .btn-action.map { color: var(--gold-brand); border-color: var(--gold-brand); }

        .btn-submit { 
            grid-column: span 2;
            background-color: var(--dark-bg); 
            color: white; 
            padding: 18px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border-radius: 15px; 
            border: none;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover { 
            background-color: var(--gold-brand);
            transform: translateY(-2px);
        }

        @media (max-width: 800px) {
            .login-form { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .btn-submit { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="login-box">
        <div class="header-frame">
            <div class="login-header">
                <h1>Únete a Elegance</h1>
                <p>La exclusividad de la joyería en tus manos</p>
            </div>
        </div>

        <form th:action="@{/registro}" method="POST" class="login-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label><i class="fas fa-user"></i> Nombre Completo</label>
                <input type="text" name="nombre" placeholder="Ej: Juan Pérez" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Corporativo</label>
                <input type="email" name="email" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Teléfono</label>
                <input type="tel" name="telefono" placeholder="300 123 4567">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" name="password" placeholder="Mínimo 6 caracteres" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-user-tag"></i> Perfil de Usuario</label>
                <select name="rol">
                    <option value="cliente">Cliente (Quiero comprar)</option>
                    <option value="proveedor">Proveedor (Quiero vender)</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Ciudad / Referencia</label>
                <input type="text" id="direccion" name="direccion" placeholder="Calle, Barrio, Ciudad...">
            </div>

            <div class="form-group full-width">
                <label>Ubicación Geográfica Precisa</label>
                <div class="button-row">
                    <button type="button" class="btn-action map" id="btn-mapa-registro">
                        <i class="fas fa-map-marker-alt"></i> Abrir Mapa de Ubicación
                    </button>
                    <button type="button" class="btn-action gps" id="btn-mi-ubicacion">
                        <i class="fas fa-crosshairs"></i> Ubicación GPS
                    </button>
                </div>

                <div id="map-registro"></div>
                <input type="hidden" id="latitud" name="latitud">
                <input type="hidden" id="longitud" name="longitud">
            </div>

            <button type="submit" class="btn-submit">REGISTRARSE AHORA</button>
        </form>

        <div style="margin-top: 30px; text-align: center; font-size: 0.95rem;">
            ¿Ya tienes una cuenta? <a th:href="@{/login}" style="color: var(--gold-brand); font-weight: 700; text-decoration: none;">Inicia sesión aquí</a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, marker;

    async function obtenerDireccion(lat, lng) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
            const data = await response.json();
            if (data && data.address) {
                const a = data.address;
                const partes = [];
                const ciudad = a.city || a.town || a.village || a.municipality;
                if (ciudad) partes.push(ciudad);
                const barrio = a.neighbourhood || a.suburb || a.residential;
                if (barrio) partes.push(barrio);
                const via = a.road || a.pedestrian || a.path;
                if (via) partes.push(via);
                document.getElementById('direccion').value = partes.join(', ');
            }
        } catch (error) { console.error("Error geocodificación:", error); }
    }

    function initMap() {
        const posInicial = [10.391, -75.479]; 
        map = L.map('map-registro').setView(posInicial, 14);
        L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0','mt1','mt2','mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        map.on('click', function(e) {
            actualizarMarcador(e.latlng);
            map.setView(e.latlng, 18);
        });
    }

    function actualizarMarcador(latlng) {
        if (marker) map.removeLayer(marker);
        marker = L.marker(latlng, { draggable: true }).addTo(map);
        document.getElementById('latitud').value = latlng.lat;
        document.getElementById('longitud').value = latlng.lng;
        obtenerDireccion(latlng.lat, latlng.lng);

        marker.on('dragend', function(e) {
            const pos = e.target.getLatLng();
            document.getElementById('latitud').value = pos.lat;
            document.getElementById('longitud').value = pos.lng;
            obtenerDireccion(pos.lat, pos.lng);
        });
    }

    document.getElementById('btn-mapa-registro').addEventListener('click', function() {
        this.style.display = 'none';
        document.getElementById('map-registro').style.display = 'block';
        if (!map) initMap();
        setTimeout(() => map.invalidateSize(), 100);
    });

    document.getElementById('btn-mi-ubicacion').addEventListener('click', function() {
        if (!navigator.geolocation) return alert("Tu navegador no soporta GPS");
        if (document.getElementById('map-registro').style.display !== 'block') {
            document.getElementById('btn-mapa-registro').click();
        }
        navigator.geolocation.getCurrentPosition(function(pos) {
            const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            map.setView(latlng, 19);
            actualizarMarcador(latlng);
        });
    });
</script>
</body>
</html>
