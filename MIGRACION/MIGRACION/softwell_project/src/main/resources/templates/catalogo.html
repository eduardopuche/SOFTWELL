<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Latin Jewelry Elegance</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="site-header">
    <div class="container header-inner">
        <div class="logo">LJE</div>
        <nav class="main-nav">
            <a th:href="@{/}" class="nav-link">Inicio</a>

            <a th:href="@{/carrito}" class="cart-link" sec:authorize="!hasRole('PROVEEDOR')">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" th:if="${cartItemCount > 0}" th:text="${cartItemCount}">0</span>
            </a>

            <div class="user-menu-container" style="position: relative; margin-left: 15px;">

                <!-- No autenticado -->
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-primary">
                        <i class="fas fa-user"></i> Inicia Sesión
                    </a>
                </div>

                <!-- Autenticado -->
                <div sec:authorize="isAuthenticated()" class="user-dropdown">
                    <button class="user-menu-button" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-user-circle" style="font-size: 28px;"></i>
                    </button>
                    <div class="dropdown-content">
                        <a sec:authorize="hasRole('CLIENTE')" th:href="@{/perfil}">
                            <i class="fas fa-user-circle"></i> Mi Perfil
                        </a>
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">
                            <i class="fas fa-tachometer-alt"></i> Panel Admin
                        </a>
                        <form th:action="@{/logout}" method="post" style="margin: 0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" style="background: none; border: none; width: 100%; text-align: left; padding: 8px 15px; cursor: pointer; color: inherit;">
                                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </nav>
    </div>
</header>

<main class="container" style="padding: 40px 20px;">
    <h1>Catálogo Completo</h1>

    <form method="get" th:action="@{/catalogo}" style="margin: 20px 0;">
        <label style="font-weight: 600;">Filtrar por categoría:</label>
        <select name="categoria" onchange="this.form.submit()" style="padding: 8px 12px; margin-left: 10px;">
            <option value="all" th:selected="${categoriaSeleccionada == 'all'}">Todos</option>
            <option value="anillos" th:selected="${categoriaSeleccionada == 'anillos'}">Anillos</option>
            <option value="collares" th:selected="${categoriaSeleccionada == 'collares'}">Collares</option>
            <option value="pulseras" th:selected="${categoriaSeleccionada == 'pulseras'}">Pulseras</option>
            <option value="aretes" th:selected="${categoriaSeleccionada == 'aretes'}">Aretes</option>
            <option value="cadenas" th:selected="${categoriaSeleccionada == 'cadenas'}">Cadenas</option>
            <option value="dijes" th:selected="${categoriaSeleccionada == 'dijes'}">Dijes</option>
            <option value="broches" th:selected="${categoriaSeleccionada == 'broches'}">Broches</option>
            <option value="relojes" th:selected="${categoriaSeleccionada == 'relojes'}">Relojes</option>
            <option value="tiaras" th:selected="${categoriaSeleccionada == 'tiaras'}">Tiaras</option>
            <option value="gemelos" th:selected="${categoriaSeleccionada == 'gemelos'}">Gemelos</option>
        </select>
    </form>

    <div class="grid">
        <a th:href="@{/productos/{id}(id=${p.id})}" class="product-card-link" th:each="p : ${productos}">
            <div class="product-card">
                <div class="product-image">
                    <img th:src="@{${p.imagen}}" th:alt="${p.nombre}" onerror="this.src='/img/placeholder.webp'">
                </div>
                <div class="product-info">
                    <h3 th:text="${p.nombre}">Nombre</h3>
                    <p class="product-category" th:text="${p.categoria}">Categoría</p>
                    <p class="product-price" th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}">$0.00</p>
                    <button class="btn-quick-view">Ver Detalles</button>
                </div>
            </div>
        </a>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <a th:href="@{/}" class="btn btn-primary">← Volver a Inicio</a>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-content">
        <div class="footer-section">
            <h4>Latin Jewelry Elegance</h4>
            <p>&copy; 2025 Todos los derechos reservados.</p>
        </div>
    </div>
</footer>

<style>
    .product-card-link { text-decoration: none; color: inherit; }
    .btn-quick-view { width: 100%; padding: 8px 12px; margin-top: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-quick-view:hover { background: var(--accent-600); transform: translateY(-2px); }
    .cart-link { position: relative; padding: 10px 15px; }
    .cart-badge { position: absolute; top: 0; right: 0; background: #ff4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
</style>
</body>
</html>
